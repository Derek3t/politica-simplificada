[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "politica-simplificada"
version = "0.1.0"
description = "Backend da Plataforma de Guia Político"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-CORS>=4.0",
    "Flask-Migrate>=4.0",
    "requests>=2.31",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["politica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
